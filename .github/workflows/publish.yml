name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify tag and package versions
        run: node -e "const fs=require('fs');const p=require('./package.json');const s=require('./server.json');const tag=process.env.GITHUB_REF_NAME.slice(1);if(p.version!==tag||s.version!==tag||s.packages[0].version!==tag)throw new Error('version mismatch')"
      - run: npm run check
      - run: npm publish --provenance --access public
