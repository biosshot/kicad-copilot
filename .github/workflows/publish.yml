name: Publish npm package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: node scripts/check-release.mjs
      - run: npm ci
      - name: Verify tag and package versions
        if: github.event_name == 'push'
        run: node -e "const fs=require('fs');const p=require('./package.json');const s=require('./server.json');const tag=process.env.GITHUB_REF_NAME.slice(1);if(p.version!==tag||s.version!==tag||s.packages[0].version!==tag)throw new Error('version mismatch')"
      - run: npm run check
      - run: npm run test:pcb-analysis
      - run: npm publish --provenance --access public
        if: github.event_name == 'push'
      - name: Install MCP Registry publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
